name: Android debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest уже содержит Android SDK (ANDROID_SDK_ROOT/ANDROID_HOME).
      - name: Show Android SDK location
        run: echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ANDROID_HOME=$ANDROID_HOME"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || {
            echo "---- build failed, surfacing error ----"
            {
              echo '## Gradle build failed'
              echo '```'
              grep -nE 'e: |error:|FAILURE:|What went wrong:|Caused by:|Could not|> |Unresolved reference|Unsupported|not found' /tmp/build.log | tail -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E 'e: |error:|What went wrong:|Caused by:|Could not|Unresolved reference|Unsupported|not found|> Task .* FAILED' /tmp/build.log | tail -10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shlagbaum-relay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
